# 只供合并参考，不是可独立加载的完整 Clash 配置。
# 先备份；将下列 UU 规则放在已有兜底规则之前，保留其他原规则。
# 不要把整个文件直接覆盖进自己的订阅。
proxies:
  - name: UU-Local-TLS-Fix
    type: socks5
    server: 127.0.0.1
    port: 17899
    udp: false

rules:
  - DOMAIN-SUFFIX,nrd.nie.163.com,UU-Local-TLS-Fix
  - DOMAIN,uuyc.webapp.163.com,UU-Local-TLS-Fix
  - DOMAIN,fp.ps.netease.com,UU-Local-TLS-Fix
  # 在此之后保留原有的 rules；故意不添加 MATCH,DIRECT。
